<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Apps 2026</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1 id="title">Project name</h1>
      <p id="subtitle">One sentence pitch goes here</p>
    </div>
    <div id="badges"></div>
  </header>

  <main>
    <section id="map"></section>
    <aside>
      <div class="controls">
        <label>Minimum score <span id="minval">0.00</span>
          <input id="min" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
      </div>
      <div id="detail">
        <h2>Click a point</h2>
        <p class="muted">Details, time series and the reasons behind the score appear here.</p>
      </div>
      <div id="series"></div>
      <div id="why"></div>
    </aside>
  </main>

  <footer id="footer"></footer>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/plotly.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
